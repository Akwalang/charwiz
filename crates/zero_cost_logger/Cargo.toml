[package]
name = "zero_cost_logger"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Zero-cost (compile-time gated) colored console logger with optional markup and compile-time aliases."
repository = "https://example.com/your-repo"

[features]
logger = []

log-error = ["logger"]
log-warn  = ["log-error"]
log-info  = ["log-warn"]
log-debug = ["log-info"]

logger-color     = ["logger"]
logger-timestamp = ["logger"]
logger-markup    = ["logger"]
logger-aliases   = ["logger-markup"]

default = [
  "log-info",
  "logger-color",
  "logger-timestamp",
  "logger-markup",
  "logger-aliases",
]

[profile.release]
# (опционально) если это твой крейт и ты хочешь подсказать типовой профиль — но обычно это на уровне приложения
# lto = true
# codegen-units = 1
