[package]
name = "charwiz"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0.99"
clipboard-win = "5.4.0"
rdev = { version="0.5.3", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_derive = "1.0"
tray-item = "0.10.0"
rust_logger = { git = "https://github.com/Akwalang/rust_logger.git", tag = "1.1.0" }
async-broadcast = "0.7.2"
mlua = { version = "0.9.9", default-features = false, features = ["lua54", "vendored", "send", "async"] }
tokio = { version = "1.48.0", features = ["macros", "rt", "time"] }

[dependencies.windows]
version = "0.59"
features = [
    "Win32_Globalization",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",

    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_Foundation",
    "Win32_System_SystemServices"
]

[build-dependencies]
embed-resource = "3.0.1"
winres = "0.1.12"

[profile.release]
lto = "fat"
codegen-units = 1
