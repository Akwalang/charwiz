[delay]
long = 150
medium = 8
short = 1

[keyboard_layouts]
ru-RU = "йцукенгшщзхъфывапролджэячсмитьбю.ёЙЦУКЕНГШЩЗХЪФЫВАПРОЛДЖЭЯЧСМИТЬБЮ,Ё!@#$%^&*()"
en-US = "qwertyuiop[]asdfghjkl;'zxcvbnm,./`QWERTYUIOP{}ASDFGHJKL:\"ZXCVBNM<>?~!@#$%^&*()"

[[actions]]
keys = ["Ctrl", "Shift", "Alt"]
target = "word"
switch_keyboard_layout = true
handler = "convert_char_layout"

[[actions]]
keys = ["Ctrl", "Shift", "MetaLeft"]
target = "selection"
switch_keyboard_layout = true
handler = "convert_char_layout"

[[actions]]
keys = ["Ctrl", "Shift", "KeyZ"]
target = "selection"
handler = "invert_case"

[[actions]]
keys = ["Ctrl", "Alt", "KeyV"]
target = "clipboard"
handler = "to_snake_case"

[[actions]]
keys = ["Ctrl", "Alt", "KeyB"]
target = "clipboard"
handler = "to_pascal_case"

[[actions]]
keys = ["Ctrl", "Alt", "KeyN"]
target = "clipboard"
handler = "to_camel_case"

[[actions]]
keys = ["Ctrl", "Alt", "KeyM"]
target = "clipboard"
handler = "to_kebab_case"

[[actions]]
keys = ["Ctrl", "Alt", "KeyP"]
target = "clipboard"
handler = "json_log"

[[actions]]
keys = ["Ctrl", "Alt", "KeyO"]
target = "clipboard"
handler = "js_breakpoints"
