[package]
name = "charwiz"
version = "0.3.0"
edition = "2021"

[dependencies]
anyhow = "1.0.99"
rdev = { version="0.5.3", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_derive = "1.0"
mlua = { version = "0.9.9", default-features = false, features = ["lua54", "vendored", "send", "async", "macros", "serialize"] }
tokio = { version = "1.48.0", features = ["macros", "rt", "sync", "time"] }
logger = { path = "../../crates/logger" }
zeroize = "1.7"

[features]
default = ["dev"]
dev=["logger"]
prod = []
logger = []

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5.4.0"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.59"
features = [
    "Win32_Globalization",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",

    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_Foundation",
    "Win32_System_SystemServices"
]

[target.'cfg(target_os = "linux")'.dependencies]
x11 = "2.21.0"
x11-clipboard = "0.7"

[build-dependencies]
embed-resource = "3.0.1"
winres = "0.1.12"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
